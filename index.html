
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Normal bir deneme</title>

<style>
body{
    font-family: Arial;
    background:#ffffff;
    color:#222;
    margin:0;
    text-align:center;
}

header{
    background:#f5f5f5;
    padding:20px;
    font-size:28px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

button{
    padding:8px 15px;
    margin:5px;
    cursor:pointer;
    border:none;
    background:black;
    color:white;
    border-radius:6px;
}

input{
    padding:8px;
    margin:5px;
}

#adminPanel,#authPanel,#cartPanel{
    display:none;
    background:#fafafa;
    padding:15px;
    border-top:1px solid #ddd;
}

.product{
    display:inline-block;
    border:1px solid #ddd;
    padding:15px;
    margin:10px;
    width:200px;
    border-radius:10px;
}

.product img{
    width:100%;
    height:150px;
    object-fit:cover;
    border-radius:5px;
}
</style>
</head>

<body>

<header>Deneneme</header>

<button onclick="showAuth()">Giriş / Kayıt</button>
<button onclick="adminLogin()">Admin</button>
<button onclick="toggleCart()">Sepet</button>

<div id="authPanel">
<h3>Kullanıcı İşlemleri</h3>
<input type="text" id="username" placeholder="Kullanıcı Adı">
<input type="password" id="password" placeholder="Şifre">
<br>
<button onclick="register()">Kayıt Ol</button>
<button onclick="login()">Giriş Yap</button>
</div>

<div id="adminPanel">
<h3>Admin Panel</h3>
<input type="text" id="titleInput" placeholder="Ürün Adı">
<input type="text" id="priceInput" placeholder="Fiyat">
<input type="text" id="imageInput" placeholder="Görsel URL">
<br>
<button onclick="addProduct()">Ürün Ekle</button>
</div>

<h2>Ürünler</h2>
<div id="products"></div>

<div id="cartPanel">
<h3>Sepet</h3>
<div id="cartItems"></div>
<h4 id="total"></h4>
<button onclick="checkout()">Ödeme Yap</button>
</div>

<script>
let users = JSON.parse(localStorage.getItem("users")) || [];
let products = JSON.parse(localStorage.getItem("products")) || [];
let cart = [];
let isAdmin = false;
let currentUser = null;

function saveData(){
    localStorage.setItem("users", JSON.stringify(users));
    localStorage.setItem("products", JSON.stringify(products));
}

function showAuth(){
    authPanel.style.display = authPanel.style.display==="block" ? "none":"block";
}

function toggleCart(){
    cartPanel.style.display = cartPanel.style.display==="block" ? "none":"block";
}

function register(){
    let u=username.value;
    let p=password.value;
    if(u && p){
        users.push({u,p});
        saveData();
        alert("Kayıt başarılı!");
    }
}

function login(){
    let u=username.value;
    let p=password.value;
    let user=users.find(x=>x.u===u && x.p===p);
    if(user){
        currentUser=u;
        authPanel.style.display="none";
        alert("Giriş başarılı!");
    }else{
        alert("Hatalı giriş!");
    }
}

function adminLogin(){
    let pass=prompt("Admin şifre:");
    if(pass==="1234"){
        isAdmin=true;
        adminPanel.style.display="block";
        alert("Admin aktif!");
        renderProducts();
    }
}

function addProduct(){
    let t=titleInput.value;
    let p=priceInput.value;
    let i=imageInput.value;
    if(t && p && i){
        products.push({t,p,i});
        saveData();
        renderProducts();
    }
}

function renderProducts(){
    productsDiv.innerHTML="";
    products.forEach((x,index)=>{
        productsDiv.innerHTML+=`
        <div class="product">
            <img src="${x.i}">
            <h3>${x.t}</h3>
            <p>${x.p} TL</p>
            <button onclick="addToCart(${index})">Sepete Ekle</button>
            ${isAdmin?`
            <button onclick="editProduct(${index})">Düzenle</button>
            <button onclick="deleteProduct(${index})">Sil</button>`:""}
        </div>`;
    });
}

function deleteProduct(i){
    products.splice(i,1);
    saveData();
    renderProducts();
}

function editProduct(i){
    let nt=prompt("Yeni isim:",products[i].t);
    let np=prompt("Yeni fiyat:",products[i].p);
    let ni=prompt("Yeni görsel:",products[i].i);
    if(nt && np && ni){
        products[i]={t:nt,p:np,i:ni};
        saveData();
        renderProducts();
    }
}

function addToCart(i){
    if(!currentUser){
        alert("Önce giriş yap!");
        return;
    }
    cart.push(products[i]);
    renderCart();
}

function renderCart(){
    cartItems.innerHTML="";
    let toplam=0;
    cart.forEach(x=>{
        cartItems.innerHTML+=`<p>${x.t} - ${x.p} TL</p>`;
        toplam+=parseInt(x.p);
    });
    total.innerText="Toplam: "+toplam+" TL";
}

function checkout(){
    if(cart.length===0){
        alert("Sepet boş!");
        return;
    }
    alert("Ödeme başarılı! (Demo ödeme ekranı)");
    cart=[];
    renderCart();
}

let productsDiv=document.getElementById("products");
renderProducts();
</script>

</body>
</html>
