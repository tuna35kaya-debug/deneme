<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuna Shop</title>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background:white;
}

header {
    background:black;
    color:white;
    padding:15px;
    text-align:center;
}

.container {
    padding:20px;
    max-width:1000px;
    margin:auto;
}

input, button {
    padding:10px;
    margin:5px 0;
    width:100%;
    box-sizing:border-box;
}

button {
    background:black;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover {
    background:gray;
}

.card {
    border:1px solid #ddd;
    padding:15px;
    margin:10px 0;
    border-radius:8px;
}

.admin-panel {
    background:#f2f2f2;
    padding:15px;
    margin-top:20px;
    border-radius:10px;
}

.delete-btn {
    background:red;
    margin-top:10px;
}

@media (min-width:768px) {
    .flex {
        display:flex;
        gap:20px;
    }
    .flex > div {
        flex:1;
    }
}
</style>
</head>

<body>

<header>
<h2>Tuna Shop</h2>
</header>

<div class="container">

<h3>Üye Ol</h3>
<input type="text" id="regName" placeholder="İsim">
<input type="text" id="regUser" placeholder="Kullanıcı Adı">
<input type="password" id="regPass" placeholder="Şifre">
<button onclick="register()">Kayıt Ol</button>

<hr>

<h3>Admin Giriş</h3>
<input type="text" id="adminUser" placeholder="Admin Kullanıcı Adı">
<input type="password" id="adminPass" placeholder="Admin Şifre">
<button onclick="adminLogin()">Giriş Yap</button>

<div id="adminPanel" style="display:none;" class="admin-panel">
<h3>Admin Paneli</h3>
<p><b>Kayıtlı Üyeler:</b></p>
<div id="userList"></div>
</div>

</div>

<script>
let users = JSON.parse(localStorage.getItem("users")) || [];

function register(){
    let name = document.getElementById("regName").value;
    let user = document.getElementById("regUser").value;
    let pass = document.getElementById("regPass").value;

    if(name && user && pass){
        users.push({name, user});
        localStorage.setItem("users", JSON.stringify(users));
        alert("Kayıt başarılı!");
    } else {
        alert("Tüm alanları doldur!");
    }
}

function adminLogin(){
    let user = document.getElementById("adminUser").value;
    let pass = document.getElementById("adminPass").value;

    if(user === "admin" && pass === "1234"){
        document.getElementById("adminPanel").style.display = "block";
        showUsers();
    } else {
        alert("Hatalı giriş!");
    }
}

function showUsers(){
    let list = document.getElementById("userList");
    list.innerHTML = "";

    if(users.length === 0){
        list.innerHTML = "Henüz üye yok.";
        return;
    }

    users.forEach((u, index) => {
        list.innerHTML += `
        <div class="card">
            <b>İsim:</b> ${u.name}<br>
            <b>Kullanıcı:</b> ${u.user}
            <button class="delete-btn" onclick="deleteUser(${index})">Üyeyi Sil</button>
        </div>
        `;
    });
}

function deleteUser(index){
    users.splice(index,1);
    localStorage.setItem("users", JSON.stringify(users));
    showUsers();
}
</script>

</body>
</html>
