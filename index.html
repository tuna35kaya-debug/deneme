<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fres Shop</title>

<style>
body{margin:0;font-family:Arial;background:white;}
header{
background:black;color:white;padding:10px 20px;
display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;
}
.logo{font-size:20px;font-weight:bold;cursor:pointer;}
.nav-right{display:flex;gap:15px;align-items:center;flex-wrap:wrap;}
.nav-right a{color:white;text-decoration:none;cursor:pointer;}
.search-box input{padding:6px;border:none;border-radius:4px;}
.container{padding:20px;max-width:1000px;margin:auto;}
button{padding:10px;margin-top:5px;width:100%;background:black;color:white;border:none;cursor:pointer;}
button:hover{background:gray;}
.card{border:1px solid #ddd;padding:15px;margin:10px 0;border-radius:8px;}
.delete-btn{background:red;}
.edit-btn{background:orange;}
.logout-btn{background:blue;margin-top:10px;}
img{max-width:100%;border-radius:6px;margin-top:10px;}
.product-grid{display:grid;grid-template-columns:1fr;gap:15px;}
@media (min-width:768px){.product-grid{grid-template-columns:repeat(3,1fr);}}

/* Sepet popup */
.cart-popup{
display:none;position:absolute;right:20px;top:60px;
background:white;color:black;width:300px;
border:1px solid #ccc;padding:15px;border-radius:8px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);z-index:1000;
}
</style>
</head>

<body>

<header>
<div class="logo">Fres Shop</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Ürün ara..." 
onkeyup="searchProduct()" 
onkeydown="if(event.key==='Enter'){this.value='';showProducts();}">
</div>

<div class="nav-right">
<a onclick="toggleCart()">🛒 Sepet (<span id="cartCount">0</span>)</a>
<a onclick="openRegister()">👤 Üye Ol</a>
<a onclick="openAdmin()">🔐 Admin</a>
</div>
</header>

<div id="cartPopup" class="cart-popup">
<h4>Sepet</h4>
<div id="cartList"></div>
<button onclick="fakePayment()">Ödeme Yap</button>
</div>

<div class="container">

<h3>Ürünler</h3>
<div id="productList" class="product-grid"></div>

<div id="adminPanel" style="display:none;" class="card">
<h3>Admin Paneli</h3>

<input type="text" id="pName" placeholder="Ürün Adı"
onkeydown="if(event.key==='Enter'){addProduct();this.value='';}">
<input type="text" id="pPrice" placeholder="Fiyat"
onkeydown="if(event.key==='Enter'){addProduct();this.value='';}">
<input type="text" id="pImage" placeholder="Görsel URL"
onkeydown="if(event.key==='Enter'){addProduct();this.value='';}">

<button onclick="addProduct()">Kaydet</button>
<button class="logout-btn" onclick="adminLogout()">Admin Çıkış</button>
</div>

</div>

<script>
let users = JSON.parse(localStorage.getItem("users")) || [];
let products = JSON.parse(localStorage.getItem("products")) || [];
let cart = [];
let editIndex = null;

function openRegister(){
let name = prompt("İsim:");
if(name){
users.push({name:name});
localStorage.setItem("users",JSON.stringify(users));
alert("Kayıt başarılı");
}
}

function openAdmin(){
let user = prompt("Admin Kullanıcı Adı:");
let pass = prompt("Admin Şifre:");
if(user==="admin" && pass==="1234"){
adminPanel.style.display="block";
}else{alert("Hatalı giriş");}
}

function adminLogout(){
adminPanel.style.display="none";
}

function addProduct(){
if(!pName.value || !pPrice.value) return;
let product={name:pName.value,price:pPrice.value,image:pImage.value};
if(editIndex!==null){products[editIndex]=product;editIndex=null;}
else{products.push(product);}
localStorage.setItem("products",JSON.stringify(products));
showProducts();
pName.value="";pPrice.value="";pImage.value="";
}

function showProducts(filter=""){
productList.innerHTML="";
products
.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase()))
.forEach((p,i)=>{
productList.innerHTML+=`
<div class="card">
<b>${p.name}</b><br>
${p.price} TL
${p.image?`<img src="${p.image}">`:""}
<button onclick="addToCart(${i})">Sepete Ekle</button>
<button class="edit-btn" onclick="editProduct(${i})">Düzenle</button>
<button class="delete-btn" onclick="deleteProduct(${i})">Sil</button>
</div>`;
});
}

function deleteProduct(i){
products.splice(i,1);
localStorage.setItem("products",JSON.stringify(products));
showProducts();
}

function editProduct(i){
pName.value=products[i].name;
pPrice.value=products[i].price;
pImage.value=products[i].image;
editIndex=i;
}

function addToCart(i){
cart.push(products[i]);
updateCart();
}

function removeFromCart(i){
cart.splice(i,1);
updateCart();
}

function updateCart(){
cartList.innerHTML="";
cart.forEach((c,i)=>{
cartList.innerHTML+=`
<div class="card">
${c.name} - ${c.price} TL
<button class="delete-btn" onclick="removeFromCart(${i})">Çıkar</button>
</div>`;
});
cartCount.innerText=cart.length;
}

function toggleCart(){
cartPopup.style.display=
cartPopup.style.display==="block"?"none":"block";
}

function fakePayment(){
if(cart.length===0){alert("Sepet boş");return;}
alert("Ödeme başarılı (Sahte ödeme)");
cart=[];
updateCart();
}

function searchProduct(){
showProducts(searchInput.value);
}

showProducts();
</script>

</body>
</html>
