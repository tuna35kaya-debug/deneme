<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fres Shop</title>

<style>
body{margin:0;font-family:Arial;background:white;}
header{
background:black;color:white;padding:10px 20px;
display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;
}
.logo{font-size:20px;font-weight:bold;}
.nav-right{display:flex;gap:15px;align-items:center;flex-wrap:wrap;}
.nav-right a{color:white;text-decoration:none;cursor:pointer;}
.search-box input{padding:6px;border:none;border-radius:4px;}
.container{padding:20px;max-width:1000px;margin:auto;}
input,button{padding:10px;margin:5px 0;width:100%;box-sizing:border-box;}
button{background:black;color:white;border:none;cursor:pointer;}
button:hover{background:gray;}
.card{border:1px solid #ddd;padding:15px;margin:10px 0;border-radius:8px;}
.admin-panel{background:#f2f2f2;padding:15px;margin-top:20px;border-radius:10px;}
.delete-btn{background:red;margin-top:5px;}
.edit-btn{background:orange;margin-top:5px;}
.logout-btn{background:blue;margin-top:10px;}
img{max-width:100%;border-radius:6px;margin-top:10px;}
.product-grid{display:grid;grid-template-columns:1fr;gap:15px;}
@media (min-width:768px){
.product-grid{grid-template-columns:repeat(3,1fr);}
}

/* Sepet Popup */
.cart-popup{
display:none;
position:absolute;
right:20px;
top:60px;
background:white;
color:black;
width:300px;
border:1px solid #ccc;
padding:15px;
border-radius:8px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
z-index:1000;
}
.cart-popup h4{margin-top:0;}
</style>
</head>

<body>

<header>
<div class="logo">Fres Shop</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="Ürün ara..." onkeyup="searchProduct()">
</div>

<div class="nav-right">
<a onclick="toggleCart()">🛒 Sepet (<span id="cartCount">0</span>)</a>
<a href="#regName">👤 Üye Ol</a>
<a href="#adminUser">🔐 Admin</a>
</div>
</header>

<div id="cartPopup" class="cart-popup">
<h4>Sepet</h4>
<div id="cartList"></div>
<button onclick="fakePayment()">Ödeme Yap</button>
</div>

<div class="container">

<h3>Ürünler</h3>
<div id="productList" class="product-grid"></div>
<div id="adminPanel" style="display:none;" class="admin-panel">

<h3>Admin Paneli</h3>

<h4>Ürün Ekle / Düzenle</h4>
<input type="text" id="pName" placeholder="Ürün Adı">
<input type="text" id="pPrice" placeholder="Fiyat">
<input type="text" id="pImage" placeholder="Görsel URL">
<button onclick="addProduct()">Kaydet</button>

<hr>

<h4>Kayıtlı Üyeler</h4>
<div id="userList"></div>

<button class="logout-btn" onclick="adminLogout()">Admin Çıkış</button>

</div>

</div>

<script>
let users = JSON.parse(localStorage.getItem("users")) || [];
let products = JSON.parse(localStorage.getItem("products")) || [];
let cart = [];
let editIndex = null;

function register(){
if(regName.value && regUser.value && regPass.value){
users.push({name:regName.value,user:regUser.value});
localStorage.setItem("users",JSON.stringify(users));
alert("Kayıt başarılı!");
}
}

function adminLogin(){
if(adminUser.value==="admin" && adminPass.value==="1234"){
adminPanel.style.display="block";
showUsers();
}else{alert("Hatalı giriş");}
}

function adminLogout(){
adminPanel.style.display="none";
}

function showUsers(){
userList.innerHTML="";
users.forEach((u,i)=>{
userList.innerHTML+=`
<div class="card">
${u.name} (${u.user})
<button class="delete-btn" onclick="deleteUser(${i})">Sil</button>
</div>`;
});
}

function deleteUser(i){
users.splice(i,1);
localStorage.setItem("users",JSON.stringify(users));
showUsers();
}

function addProduct(){
let product={name:pName.value,price:pPrice.value,image:pImage.value};
if(editIndex!==null){
products[editIndex]=product;
editIndex=null;
}else{
products.push(product);
}
localStorage.setItem("products",JSON.stringify(products));
showProducts();
pName.value="";pPrice.value="";pImage.value="";
}

function showProducts(filter=""){
productList.innerHTML="";
products
.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase()))
.forEach((p,i)=>{
productList.innerHTML+=`
<div class="card">
<b>${p.name}</b><br>
${p.price} TL
${p.image?`<img src="${p.image}">`:""}
<button onclick="addToCart(${i})">Sepete Ekle</button>
<button class="edit-btn" onclick="editProduct(${i})">Düzenle</button>
<button class="delete-btn" onclick="deleteProduct(${i})">Sil</button>
</div>`;
});
}

function deleteProduct(i){
products.splice(i,1);
localStorage.setItem("products",JSON.stringify(products));
showProducts();
}

function editProduct(i){
pName.value=products[i].name;
pPrice.value=products[i].price;
pImage.value=products[i].image;
editIndex=i;
}

function addToCart(i){
cart.push(products[i]);
updateCart();
}

function removeFromCart(i){
cart.splice(i,1);
updateCart();
}

function updateCart(){
cartList.innerHTML="";
cart.forEach((c,i)=>{
cartList.innerHTML+=`
<div class="card">
${c.name} - ${c.price} TL
<button class="delete-btn" onclick="removeFromCart(${i})">Çıkar</button>
</div>`;
});
cartCount.innerText=cart.length;
}

function toggleCart(){
cartPopup.style.display=
cartPopup.style.display==="block"?"none":"block";
}

function fakePayment(){
if(cart.length===0){alert("Sepet boş");return;}
alert("Ödeme başarılı (Sahte ödeme)");
cart=[];
updateCart();
}

function searchProduct(){
showProducts(searchInput.value);
}

showProducts();
</script>

</body>
</html>
